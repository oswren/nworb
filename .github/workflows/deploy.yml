name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Only one deploy at a time; never cancel a deploy that is already publishing.
concurrency:
  group: deploy-personal-site
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # needed to exchange the GitHub OIDC token for AWS credentials

env:
  AWS_REGION: eu-west-2
  SITE_BUCKET: ${{ vars.SITE_BUCKET }}
  SITE_DISTRIBUTION_ID: ${{ vars.SITE_DISTRIBUTION_ID }}

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    # No `environment:` here on purpose. An environment changes the OIDC `sub`
    # claim, which would no longer match the role's trust policy.
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Assume deploy role (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # A secret, not a variable: GitHub masks secrets in logs.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # Hide the account ID from the rest of this job's logs (the repo is public).
      - name: Mask account ID in logs
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      # Hashed assets are immutable, so cache them for a year.
      - name: Publish assets
        run: |
          aws s3 sync dist/assets "s3://$SITE_BUCKET/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      # Everything else at the top level (favicon, icons), revalidated hourly.
      - name: Publish top-level files
        run: |
          aws s3 sync dist "s3://$SITE_BUCKET" \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public, max-age=3600"

      # The entry page must never be cached, so a new deploy goes live at once.
      - name: Publish index.html
        run: |
          aws s3 cp dist/index.html "s3://$SITE_BUCKET/index.html" \
            --content-type text/html \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$SITE_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text
